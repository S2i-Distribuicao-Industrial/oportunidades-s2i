<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registro de Oportunidades S2I</title>
<meta name="s2i-oportunidades" content="1">
<style>

/* Layout: barra superior com abas; à esquerda a lista de oportunidades salvas, à direita o questionário em etapas. Ferramenta de trabalho, densa e legível. */
:root{
  --bg:#f3f5f2; --panel:#ffffff; --ink:#17231b; --muted:#5d6b62; --line:#d6ddd7;
  --accent:#167a3c; --accent-ink:#ffffff; --accent-soft:#e3f2e7; --signal:#3dcd58;
  --warn:#9a5a00; --warn-soft:#fff3dc; --bad:#b3261e; --bad-soft:#fde8e6; --ok:#167a3c;
  --code:#eef1ee;
  --f-display:"Segoe UI Semibold","Segoe UI",Arial,sans-serif;
  --f-body:"Segoe UI",Arial,sans-serif;
  --f-mono:Consolas,"Courier New",monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111813; --panel:#18211b; --ink:#e6ede7; --muted:#9aaa9f; --line:#2c3a30;
  --accent:#45c46a; --accent-ink:#08210f; --accent-soft:#1d3324; --signal:#3dcd58;
  --warn:#f0b35c; --warn-soft:#3a2b12; --bad:#ff8a80; --bad-soft:#3b1b19; --ok:#45c46a; --code:#1f2b22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111813; --panel:#18211b; --ink:#e6ede7; --muted:#9aaa9f; --line:#2c3a30;
  --accent:#45c46a; --accent-ink:#08210f; --accent-soft:#1d3324; --signal:#3dcd58;
  --warn:#f0b35c; --warn-soft:#3a2b12; --bad:#ff8a80; --bad-soft:#3b1b19; --ok:#45c46a; --code:#1f2b22; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.top{border-bottom:1px solid var(--line);background:var(--panel)}
header.top .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand small{font:500 12px var(--f-body);color:var(--muted);letter-spacing:.02em}
.brand i{display:inline-block;width:10px;height:10px;background:var(--signal);border-radius:2px;transform:translateY(-1px)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.tabs button{font:600 14px var(--f-body);background:none;border:0;color:var(--muted);padding:8px 12px;border-radius:6px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--ink)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h2{font-size:22px;font-weight:700}
h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;margin-top:20px}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
aside.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;align-self:start;display:flex;flex-direction:column;gap:8px}
aside.list .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.oplist{display:flex;flex-direction:column;gap:4px;max-height:60vh;overflow:auto}
.opitem{display:grid;grid-template-columns:1fr auto;gap:2px 8px;text-align:left;background:none;border:1px solid transparent;border-radius:6px;padding:8px;cursor:pointer;color:inherit;font:inherit}
.opitem:hover{background:var(--bg)}
.opitem.on{border-color:var(--accent);background:var(--accent-soft)}
.opitem b{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opitem span{font-size:12px;color:var(--muted);grid-column:1/-1}
.pill{font:600 11px var(--f-body);letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:99px;white-space:nowrap;align-self:start}
.pill.rascunho{background:var(--code);color:var(--muted)}
.pill.pronto{background:var(--warn-soft);color:var(--warn)}
.pill.lancado{background:var(--accent-soft);color:var(--ok)}
.savebar{font-size:12px;color:var(--muted)}
.savebar.err{color:var(--bad)}
main.card,.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.steps{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);padding:0 8px}
.steps button{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:12px 10px 9px;font:600 13px var(--f-body);color:var(--muted);cursor:pointer;display:flex;gap:6px;align-items:center}
.steps button .n{font:500 11px var(--f-mono);width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;background:var(--code)}
.steps button.done .n{background:var(--accent);color:var(--accent-ink)}
.steps button.warn .n{background:var(--warn-soft);color:var(--warn)}
.steps button[aria-current="step"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{padding:20px;display:flex;flex-direction:column;gap:18px}
.pane>header{display:flex;flex-direction:column;gap:4px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.grid .full{grid-column:1/-1}
@media (max-width:620px){.grid{grid-template-columns:minmax(0,1fr)}}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-weight:600;font-size:13px}
.f label .req{color:var(--bad);margin-left:2px}
.f .hint{font-size:12px;color:var(--muted)}
.f .err{font-size:12px;color:var(--bad)}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],input[type=search],select,textarea{font:15px var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:110px;resize:vertical}
input.bad,select.bad{border-color:var(--bad);background:var(--bad-soft)}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.choice label{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;gap:10px;cursor:pointer;align-items:flex-start}
.choice label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice b{display:block;font-size:14px}
.choice small{color:var(--muted);font-size:12px;display:block}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:600 14px var(--f-body);padding:9px 14px;border-radius:6px;border:1px solid var(--accent);background:var(--panel);color:var(--accent);cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:var(--line);color:var(--ink)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.nav{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:16px;flex-wrap:wrap}
.note{background:var(--accent-soft);border-radius:6px;padding:10px 12px;font-size:13px}
.note.warn{background:var(--warn-soft);color:var(--ink)}
.note.bad{background:var(--bad-soft)}
.mono{font-family:var(--f-mono)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.03em;background:var(--bg)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
td select{padding:5px 6px;font-size:13px}
td input{padding:5px 6px;font-size:13px}
.tot{display:flex;justify-content:flex-end;gap:18px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.tot b{font-family:var(--f-display);font-size:20px}
.conf{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;white-space:nowrap}
.conf.alta{background:var(--accent-soft);color:var(--ok)}
.conf.media{background:var(--warn-soft);color:var(--warn)}
.chk{display:flex;flex-direction:column;gap:4px;font-size:14px}
.chk div{display:flex;gap:8px}
.chk .x{color:var(--bad)} .chk .v{color:var(--ok)}
pre.pack{background:var(--code);border-radius:6px;padding:10px;font:12px/1.4 var(--f-mono);white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:14px;z-index:9}
.empty{padding:40px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
/* POP */
.pop{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;margin-top:20px}
@media (max-width:860px){.pop{grid-template-columns:minmax(0,1fr)}}
.toc{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;gap:2px;font-size:14px}
.toc a{color:var(--muted);text-decoration:none;padding:5px 8px;border-radius:5px}
.toc a:hover{background:var(--panel);color:var(--ink)}
.popbody{display:flex;flex-direction:column;gap:16px}
.popbody section{padding:20px;display:flex;flex-direction:column;gap:12px}
.popbody p{margin:0;max-width:72ch}
.popbody ol,.popbody ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:76ch}
.eyebrow{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
details{border:1px solid var(--line);border-radius:6px;padding:10px 12px}
details summary{cursor:pointer;font-weight:600}
details[open] summary{margin-bottom:8px}
.path{font:500 13px var(--f-mono);background:var(--code);padding:2px 6px;border-radius:4px}
.progress{height:6px;background:var(--code);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
@media (prefers-reduced-motion:reduce){.progress i{transition:none}}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
@media (max-width:620px){.pick{grid-template-columns:minmax(0,1fr)}}
.quick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:6px;padding:8px 10px}
.quick select{width:auto;flex:1;min-width:200px}
.cadlist{display:flex;flex-direction:column}
.cadrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.cadrow:last-child{border-bottom:0}
.cadrow small{color:var(--muted);display:block;font-size:12px}

/* ---------- v2: login, usuários, caixas ---------- */
.loginwrap{min-height:100vh;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.login{width:100%;max-width:380px;padding:28px;display:flex;flex-direction:column;gap:14px}
.login .brand{font-size:21px}
.login input{font:15px var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 11px;width:100%}
.err{color:var(--bad);font-size:13px;margin:0}
.me{position:relative}
.me summary{list-style:none;cursor:pointer;padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
.me summary::-webkit-details-marker{display:none}
.me summary:hover{background:var(--bg)}
.me span{display:flex;flex-direction:column;line-height:1.2;text-align:right}
.me .menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px;display:flex;flex-direction:column;gap:4px;z-index:10;min-width:150px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.me small{color:var(--muted);font-size:11px}
nav.tabs{margin-left:0}
header.top .wrap{justify-content:space-between;gap:12px}
nav.tabs button{padding:8px 10px}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font:700 11px var(--f-body);margin-left:6px;vertical-align:1px}
.seg{display:flex;gap:2px;background:var(--bg);border-radius:6px;padding:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;padding:6px 8px;border-radius:5px;font:600 13px var(--f-body);color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.pill.pendente{background:var(--warn-soft);color:var(--warn)}
.pill.devolvida{background:var(--bad-soft);color:var(--bad)}
.pill.concluida{background:var(--accent-soft);color:var(--ok)}
.pill.cancelada{background:var(--code);color:var(--muted)}
.opitem span+span{margin-top:-2px}
.banner{margin:12px 12px 0}
.pane.ro input:disabled,.pane.ro select:disabled,.pane.ro textarea:disabled{opacity:1;background:var(--bg);color:var(--ink)}
.fluxo{padding:14px;display:flex;flex-direction:column;gap:10px}
.fluxo details{border-color:var(--line)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
@media (max-width:620px){.grid2{grid-template-columns:minmax(0,1fr)}}
.hist{display:flex;flex-direction:column;gap:8px;font-size:13px;max-height:260px;overflow:auto}
.hist .htxt{margin:2px 0 0 0;padding:6px 8px;background:var(--bg);border-radius:5px;white-space:pre-wrap}
.modal{position:fixed;inset:0;background:rgba(10,20,14,.45);display:grid;place-items:center;z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dlg{width:100%;max-width:420px;padding:22px;display:flex;flex-direction:column;gap:12px}
.dlg input{font:15px var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%}
.sec{padding:20px;display:flex;flex-direction:column;gap:12px}
.sub{padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.sub input[type=text],.sub input[type=email],.sub select,.sub textarea{background:var(--panel)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;background:var(--code);color:var(--ink);padding:2px 7px;border-radius:99px;white-space:nowrap}
.perms{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:6px}
.big{font-size:16px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tiles div{background:var(--bg);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column}
.tiles span{font-size:12px;color:var(--muted)}
.tiles b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.filt input[type=date]{max-width:220px}
input[type=file]{font-size:13px}
input[type=password]{font:15px var(--f-body)}
.me{border:0;padding:0}
a{color:var(--accent)}
.opitem em.pill{font-style:normal}

</style>
</head>
<body>
<div id="login" class="loginwrap" hidden>
  <form class="card login" id="lgForm" autocomplete="on">
    <div class="brand"><i></i>Registro de Oportunidades</div>
    <p class="muted" style="margin:0">S2I · entre com o usuário e a senha que o administrador passou.</p>
    <div class="f"><label for="lgUser">Usuário</label><input id="lgUser" name="username" autocomplete="username" required></div>
    <div class="f"><label for="lgPass">Senha</label><input id="lgPass" name="password" type="password" autocomplete="current-password" required></div>
    <p class="err" id="lgErr" hidden></p>
    <button class="btn pri" id="lgBtn">Entrar</button>
    <p class="muted" style="margin:0;font-size:12px">Esqueceu a senha? Peça ao administrador para redefinir.</p>
  </form>
</div>

<div id="app" hidden>
<header class="top"><div class="wrap">
  <div class="brand"><i></i>Oportunidades <small>S2I</small></div>
  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" data-view="ops" aria-selected="true">Oportunidades<span class="badge" id="tabBadge" hidden></span></button>
    <button role="tab" data-view="rel" data-perm="relatorios" aria-selected="false">Relatórios</button>
    <button role="tab" data-view="cad" aria-selected="false">Cadastros</button>
    <button role="tab" data-view="fab" data-perm="fabricantes" aria-selected="false">Fabricantes</button>
    <button role="tab" data-view="usr" data-perm="usuarios" aria-selected="false">Usuários</button>
    <button role="tab" data-view="pop" aria-selected="false">POP</button>
    <button role="tab" data-view="bm" data-perm="lancar" aria-selected="false">Extensão <span id="extChip" class="pill rascunho">verificando</span></button>
  </nav>
  <details class="me" id="meMenu"><summary><span><b id="meNome"></b><small id="mePapel"></small></span></summary>
    <div class="menu"><button class="btn small ghost" id="btnSenha">Trocar senha</button><button class="btn small ghost" id="btnSair">Sair</button></div></details>
</div></header>

<div class="wrap">
  <section data-pane="ops">
    <div class="layout">
      <aside class="list">
        <div class="head"><h3>Oportunidades</h3><button class="btn small pri" id="btnNew">+ Nova</button></div>
        <div class="seg" id="caixas"></div>
        <input type="search" id="opSearch" placeholder="Buscar cliente, projeto, vendedor">
        <div class="oplist" id="opList"></div>
        <div class="savebar" id="saveBar"></div>
        <div class="row" id="antigos"></div>
      </aside>
      <main class="card" id="editor"></main>
    </div>
  </section>
  <section data-pane="rel" id="view-rel" hidden></section>
  <section data-pane="cad" id="view-cad" hidden></section>
  <section data-pane="fab" id="view-fab" hidden></section>
  <section data-pane="usr" id="view-usr" hidden></section>
  <section data-pane="pop" id="view-pop" hidden></section>
  <section data-pane="bm" id="view-bm" hidden></section>
</div>
</div>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>
<script src="lib/xlsx.full.min.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/jspdf.plugin.autotable.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
